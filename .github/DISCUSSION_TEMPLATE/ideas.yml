title: "[Idea] "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the idea! Others can upvote it and join in below.
        For something that's broken, please [report a bug](https://github.com/matyas-zavora/ai-radio-host/issues/new?template=bug_report.yml) instead.
  - type: textarea
    id: idea
    attributes:
      label: What would you like?
      description: Describe it the way you'd use it.
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why would it help?
      description: What's missing or annoying today?
  - type: textarea
    id: alternatives
    attributes:
      label: Anything you've tried instead?
