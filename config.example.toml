# Copy to config.toml (gitignored) or ~/.config/ai-radio-host/config.toml and edit.
# Every key is optional; the values below are the defaults.
# Secrets (API keys) go in .env, not here.

[break]
every_n_tracks = 3        # talk break after every N tracks
min_played_seconds = 30   # a track counts toward N once it has played this long
lead_ms = 800             # pause this long before the current track ends
min_seconds = 15          # target length of the spoken break
max_seconds = 25
transition = "pause"      # pause = stop the music | duck = talk over the lowered music (radio style, see README)
duck_level = 30           # music volume while the host talks, % of normal
fade_down_ms = 1500
fade_up_ms = 3000

[host]
language = "en"           # "en" or "cs"; override per run with --lang
name = ""                 # optional on-air name
personality = "a warm late-night radio DJ: relaxed and smooth, a little witty, talks like a friend keeping the listener company"

[llm]
provider = "anthropic"    # anthropic (Claude API) | ollama (local model, free)
model = "claude-sonnet-5"
effort = "medium"         # low | medium | high
ollama_url = "http://localhost:11434"
ollama_model = "qwen2.5:7b"   # any model from `ollama list`; small models follow the facts-only rule less reliably

[tts]
fallback = "piper"        # if a Google voice fails or hits its budget, use the Piper voice; "" = skip the break

[tts.voices]              # the voice for each language; Google (en-US-...) or Piper (en_US-...) names
en = "en-US-Chirp3-HD-Charon"
cs = "cs-CZ-Chirp3-HD-Charon"

[tts.google]
monthly_char_limit = 900000   # Chirp 3 HD free tier is 1M chars/month; this app's usage only
[tts.google.voices]      # defaults when switching a language to Google
en = "en-US-Chirp3-HD-Charon"
cs = "cs-CZ-Chirp3-HD-Charon"

[tts.piper]
voices_dir = "~/.local/share/ai-radio-host/piper"   # voices download here automatically
[tts.piper.voices]       # defaults for Piper, and the fallback voice when Google fails
en = "en_US-ryan-high"
cs = "cs_CZ-jirka-medium"

[player]
backends = ["mpris", "applescript", "cli", "webapi"]   # tried in this order; mpris = Linux, applescript = macOS
mpris_name = "auto"      # first running Spotify app; or "spotify", "spotifast", "spotifyd", ...

[audio]
command = ""              # "" = auto (pw-play, paplay, mpv, afplay); e.g. "mpv --no-video"
volume = 100              # host voice volume in %, ignored with a custom command

[spotify]
redirect_uri = "http://127.0.0.1:8888/callback"   # must match the Spotify app exactly

[updates]
check = true              # look for a new release on GitHub when the app opens (offers to install it)
skip_version = ""         # set by "Skip This Version"; no prompt for this version
