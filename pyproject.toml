[project]
name = "ai-radio-host"
version = "0.2.0"
description = "AI radio host talk breaks between your Spotify songs (Linux)"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=1.0",
    "httpx>=0.27",
    "jeepney>=0.8",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
piper = ["piper-tts>=1.3"]
google = ["google-cloud-texttospeech>=2.16"]

[project.scripts]
radiohost = "radiohost.__main__:main"
radiohost-gui = "radiohost.gui:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["radiohost*"]
